# GitHub Actions workflow to build new release of feeze for ubuntu 24
#
# -----------------------------------------------------------------------

name: release_ubuntu_24

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write  # for ncipollo/release-action to create a release
    runs-on: ubuntu-24.04
    steps:
    - name: show what we do
      run: |
        printf "\033[1;34mrelease feeze for `cat /etc/os-release | grep PRETTY_NAME= | sed -E 's .*"(.*)" \1 g'` `uname -r`\033[0m\n"

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install openjdk-25-jdk-headless libgc1 libgc-dev
        sudo apt-get install libelf-dev
        sudo apt-get install linux-tools-`uname -r`
        sudo apt-get install pandoc
        sudo apt-get install inkscape imagemagick

        echo "JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-25-openjdk-amd64/bin" >> $GITHUB_PATH

    - name: checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: checkout submodules
      run: |
        git submodule init
        git submodule update

    - name: Ensure bpftool works on current kernel
      # taken from https://github.com/actions/runner-images/issues/14203
      shell: bash
      run: |
       set -euo pipefail
       KREL="$(uname -r)"
       if ! /usr/sbin/bpftool -V >/dev/null 2>&1; then
         printf "\033[1;35m*** using workaround for bpftool ***\033[0m\n"
         if ! find /usr/lib -type f -name bpftool -perm -111 2>/dev/null | grep -q .; then
           sudo apt-get update
           sudo apt-get install -y --no-install-recommends linux-tools-generic
         fi
         FALLBACK="$(find /usr/lib -type f -name bpftool -perm -111 2>/dev/null | sort -V | tail -n 1)"
         [[ -n "$FALLBACK" ]] || { echo "No bpftool payload found"; exit 1; }
         sudo mkdir -p "/usr/lib/linux-tools/${KREL}"
         sudo ln -sf "$FALLBACK" "/usr/lib/linux-tools/${KREL}/bpftool"
       fi
       /usr/sbin/bpftool -V

    - name: build release
      run: |
        make release

    - name: Read VERSION file
      id: getversion
      run: |
        version="$(make show_version_and_platform)"
        echo "version=$version" >> $GITHUB_OUTPUT
        echo $version | grep dev && echo "prerelease=true" >> $GITHUB_OUTPUT || echo "prerelease=false" >> $GITHUB_OUTPUT

    - name: publish release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        artifacts: "feeze_${{ steps.getversion.outputs.version }}.tar.gz"
        tag: "feeze_${{ steps.getversion.outputs.version }}"
        prerelease: ${{ steps.getversion.outputs.prerelease }}
        generateReleaseNotes: false
        immutableCreate: true
        token: ${{ secrets.GITHUB_TOKEN }}
